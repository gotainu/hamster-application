<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>支払いが完了しました</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #12182f;
      color: #fff;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #1d2743;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 60px rgba(0,0,0,.25);
    }
    .icon {
      font-size: 44px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }
    p {
      color: #cfd6e6;
      line-height: 1.7;
      margin: 0 0 18px;
    }
    .note {
      background: rgba(0, 214, 163, .12);
      color: #00d6a3;
      border-radius: 16px;
      padding: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✅</div>
    <h1>支払いが完了しました</h1>
    <p>
      Hamster Care Premium Plan の登録が完了しました。
      アプリに戻ると、有料プランの状態が反映されます。
    </p>
    <div class="note">
      アプリの「利用プラン」画面に戻って確認してください。
    </div>
  </main>
</body>
</html>
